name: Generate Juniper Global Outlook
run-name: Juniper Outlook ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique report request ID
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: live-intel
  cancel-in-progress: false
jobs:
  generate:
    if: github.actor == 'belus6' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Research and write Outlook
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUTLOOK_REQUEST_ID: ${{ inputs.request_id }}
        run: python pipeline/generate_outlook.py "$OUTLOOK_REQUEST_ID"
      - name: Keep recovery copy of generated draft
        uses: actions/upload-artifact@v4
        with:
          name: outlook-${{ inputs.request_id }}
          path: docs/data/outlook/generated/${{ inputs.request_id }}.json
          retention-days: 7
      - name: Preserve generated draft
        run: |
          git config user.name "jr-outlook-bot"
          git config user.email "jr-outlook-bot@users.noreply.github.com"
          git add docs/data/outlook/generated docs/data/outlook/latest-generated.json
          git commit -m "Generate Juniper Global Outlook draft"
          git pull --rebase origin main
          git push origin HEAD:main
