name: Check Outlook API connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/outlook-api-check.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    if: github.actor == 'belus6' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check API with a small diagnostic request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/check_outlook_api.py
